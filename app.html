<div id="om-timing" role="status" aria-live="polite"></div>
<script>
(() => {
  const t = () => (performance.now() / 1000).toFixed(1) + "s";
  const box = document.getElementById("om-timing");
  const st = window.__om = { readable: null, ready: null, jspi: typeof WebAssembly.Suspending === "function" };
  const hasTool = !!document.querySelector("[data-om-tool]");
  const paint = () => {
    const parts = [];
    if (st.readable) parts.push("Readable " + st.readable);
    if (hasTool) parts.push(st.ready ? "Tool ready " + st.ready : "Tool loading…");
    box.textContent = parts.join("  |  ");
  };
  if (document.querySelector("[data-om-static]")) st.readable = t();
  paint();
  if (!hasTool) return;
  const frame = document.querySelector("iframe[data-om-tool]");
  const poll = setInterval(() => {
    let doc = document;
    try { if (frame) doc = frame.contentDocument; } catch (e) { return; }
    if (doc && doc.querySelector('[data-testid="stMain"] h1')) {
      st.ready = t(); if (!st.readable) st.readable = st.ready; paint(); clearInterval(poll);
    }
  }, 250);
})();
